<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carnivore Chaos | Evrima</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #e51b23;
    --dark-red: #790000;
    --black: #050505;
    --panel: #0b0b0b;
    --border: #3b1010;
    --muted: #999;
    --gold: #ffc928;
}

body {
    background:
        radial-gradient(circle at 80% 20%, rgba(120,0,0,.18), transparent 30%),
        #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

/* TOP BAR */

.topbar {
    height: 65px;
    background: rgba(3,3,3,.97);
    border-bottom: 1px solid #3b1010;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 35px;
    gap: 25px;
}

.online {
    font-size: 13px;
    letter-spacing: 1px;
}

.online-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    background: #55e76b;
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 12px #55e76b;
}

.steam-login {
    background: #151515;
    border: 1px solid #3d3d3d;
    color: white;
    padding: 10px 18px;
    cursor: pointer;
}

/* SIDEBAR */

.sidebar {
    width: 255px;
    background:
        linear-gradient(rgba(3,3,3,.96), rgba(3,3,3,.98));
    border-right: 1px solid #4b1010;
    min-height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 10;
}

.logo {
    padding: 30px 20px 25px;
    text-align: center;
    border-bottom: 1px solid #261010;
}

.logo-main {
    font-size: 27px;
    font-weight: 1000;
    letter-spacing: 2px;
}

.logo-main span {
    display: block;
    color: var(--red);
    font-size: 35px;
    text-shadow: 0 0 18px rgba(255,0,0,.4);
}

.logo-sub {
    color: #aaa;
    letter-spacing: 8px;
    font-size: 11px;
    margin-top: 8px;
}

.menu {
    padding: 15px 12px;
}

.menu a {
    display: flex;
    align-items: center;
    gap: 13px;
    color: #aaa;
    text-decoration: none;
    padding: 13px 14px;
    margin-bottom: 3px;
    border: 1px solid transparent;
    border-left: 3px solid transparent;
    transition: .2s;
    font-size: 14px;
    font-weight: 700;
}

.menu a:hover {
    color: white;
    background: linear-gradient(90deg,#260000,#0a0a0a);
    border-left-color: var(--red);
    transform: translateX(3px);
}

.menu a.active {
    color: white;
    background: linear-gradient(90deg,#400000,#120606);
    border: 1px solid #8b1515;
    border-left: 3px solid #ff2929;
    box-shadow: 0 0 18px rgba(255,0,0,.12);
}

.icon {
    width: 22px;
    text-align: center;
}

/* MAIN */

.page {
    margin-left: 255px;
    min-height: 100vh;
}

.content {
    padding: 22px;
}

/* HERO */

.hero {
    min-height: 520px;
    position: relative;
    overflow: hidden;
    border: 1px solid #5a1515;
    background-image:
        linear-gradient(
            90deg,
            rgba(0,0,0,.18),
            rgba(0,0,0,.05)
        ),
        url("Carnivore-chaos-heros.png");
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    box-shadow:
        inset 0 -100px 100px rgba(0,0,0,.55),
        0 0 30px rgba(150,0,0,.12);
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(to bottom, transparent 60%, rgba(0,0,0,.85)),
        radial-gradient(circle, transparent 45%, rgba(0,0,0,.35));
    pointer-events: none;
}

.hero-actions {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 18px;
    padding-bottom: 28px;
}

.chaos-btn {
    min-width: 230px;
    padding: 16px 25px;
    color: white;
    background: rgba(8,8,8,.88);
    border: 1px solid #c82020;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,.18);
    transition: .2s;
}

.chaos-btn.primary {
    background: linear-gradient(90deg,#810000,#d11b1b);
}

.chaos-btn:hover {
    transform: translateY(-3px);
    border-color: #ff4a4a;
    box-shadow: 0 0 30px rgba(255,0,0,.4);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
    margin-top: 15px;
}

.stat {
    background:
        linear-gradient(145deg,#0c0c0c,#090909);
    border: 1px solid #3d1515;
    padding: 21px;
    position: relative;
    overflow: hidden;
}

.stat::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    height: 2px;
    width: 40%;
    background: var(--red);
}

.stat-label {
    color: #999;
    font-size: 11px;
    letter-spacing: 2px;
}

.stat-value {
    font-size: 30px;
    font-weight: 1000;
    margin-top: 7px;
}

.stat-value.red {
    color: #ff2929;
}

/* FEATURE CARDS */

.features {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    margin-top: 15px;
}

.feature {
    min-height: 210px;
    background:
        radial-gradient(circle at 100% 100%,rgba(120,0,0,.22),transparent 45%),
        linear-gradient(145deg,#0d0d0d,#080808);
    border: 1px solid #431515;
    padding: 28px;
    position: relative;
    overflow: hidden;
    transition: .25s;
}

.feature:hover {
    transform: translateY(-4px);
    border-color: #8f2020;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
}

.feature h2 {
    font-size: 21px;
    margin-bottom: 13px;
}

.feature p {
    color: #aaa;
    font-size: 14px;
    line-height: 1.6;
    max-width: 390px;
}

.feature-link {
    display: inline-block;
    margin-top: 25px;
    color: #ff3030;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: .5px;
    cursor: pointer;
}

.feature.prime {
    border-color: #604b13;
    background:
        radial-gradient(circle at 80% 50%,rgba(173,119,0,.22),transparent 40%),
        linear-gradient(145deg,#100e07,#090909);
}

.feature.prime h2,
.feature.prime .feature-link {
    color: var(--gold);
}

/* SERVER STRIP */

.server-strip {
    margin-top: 15px;
    min-height: 150px;
    border: 1px solid #343434;
    background:
        linear-gradient(90deg,#080808,#0d0d0d);
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
}

.server-block {
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.server-title {
    color: #999;
    letter-spacing: 3px;
    font-size: 12px;
}

.server-online {
    color: #62e77a;
    font-size: 25px;
    font-weight: 1000;
    margin-top: 8px;
}

.quote {
    color: #777;
    font-size: 18px;
    font-style: italic;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.discord {
    border-left: 1px solid #292929;
}

.discord button {
    margin-top: 15px;
    background: #a60000;
    color: white;
    border: 1px solid #ef2c2c;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
}

/* FOOTER */

footer {
    color: #555;
    text-align: center;
    padding: 30px;
    font-size: 12px;
    letter-spacing: 2px;
}

/* MOBILE */

@media(max-width: 1000px) {

    .sidebar {
        width: 80px;
    }

    .logo-main,
    .logo-sub,
    .menu a span.label {
        display: none;
    }

    .menu a {
        justify-content: center;
        font-size: 20px;
    }

    .page {
        margin-left: 80px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .features {
        grid-template-columns: 1fr;
    }

    .server-strip {
        grid-template-columns: 1fr;
    }

    .discord {
        border-left: none;
        border-top: 1px solid #292929;
    }

}

@media(max-width: 650px) {

    .hero {
        min-height: 400px;
    }

    .hero-actions {
        flex-direction: column;
    }

    .stats {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>



<div class="page">

    <div class="topbar">

        <div class="online">
            <span class="online-dot"></span>
            WEBSITE ONLINE
        </div>

        <button class="steam-login">
            STEAM LOGIN
        </button>

    </div>

    <main class="content">

        <section class="hero">

            <div class="hero-actions">

                <button class="chaos-btn primary">
                    ENTER THE CHAOS
                </button>

                <button class="chaos-btn">
                    DINO MARKET
                </button>

            </div>

        </section>

   
        <section class="server-strip">

            <div class="server-block">

                <div class="server-title">
                    SERVER STATUS
                </div>

                <div class="server-online">
                    ● COMING SOON
                </div>

                <div style="color:#777;margin-top:7px;">
                    EVRIMA • CARNIVORE CHAOS
                </div>

            </div>

            <div class="quote">
                “IN THIS WORLD, YOU'RE EITHER THE HUNTER OR THE PREY.”
            </div>

            <div class="server-block discord">

                <strong>💬 JOIN OUR DISCORD</strong>

                <div style="color:#777;margin-top:7px;">
                    COMMUNITY • EVENTS • SUPPORT
                </div>

                <button>
                    JOIN DISCORD →
                </button>

            </div>

        </section>

    </main>

    <footer>
        CARNIVORE CHAOS • EVRIMA COMMUNITY
    </footer>

</div>

</body>
</html>
